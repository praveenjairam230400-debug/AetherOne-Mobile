name: Aether standalone Windows smoke
on:
  push:
    branches: [aether-standalone-windows]
    paths: [.github/workflows/aether-standalone-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Compile launcher and verify official engine
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('source.zip', [Convert]::FromBase64String(''))
          Expand-Archive source.zip source
          Set-Location source
          go test ./src
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed' }
          New-Item -ItemType Directory package | Out-Null
          $env:CGO_ENABLED = '0'
          go build -buildvcs=false -trimpath -ldflags '-s -w -H windowsgui' -o package/AetherOne.exe ./src
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }
          Get-FileHash package/AetherOne.exe
          Invoke-WebRequest 'https://github.com/brave/brave-browser/releases/download/v1.99.55/brave-v1.99.55-win32-x64.zip' -OutFile engine.zip
          if ((Get-FileHash engine.zip).Hash -ne 'ababc163488bfd58cab7ebe4a4057dd23227c81f5958f3a8597526a278fbae15') { throw 'Engine archive digest mismatch' }
          Expand-Archive engine.zip package/Engine
          ./tools/Smoke-Windows.ps1 -Package package | Tee-Object -FilePath smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-standalone-windows-smoke
          path: source/smoke.json
