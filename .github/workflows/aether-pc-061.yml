name: Build Aether PC 0.6.1 extension fix
on:
  push:
    branches: [aether-pc-061-extensions]
    paths: [.github/workflows/aether-pc-061.yml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6108f8046c2006ae8881f2f0af46dcb90f44984a
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build source with extension patch
        shell: pwsh
        run: |
          Expand-Archive AetherOne-PC-Source.zip -DestinationPath source
          [IO.File]::WriteAllBytes('patch.zip', [Convert]::FromBase64String(''))
          Expand-Archive patch.zip -DestinationPath source/AetherOnePC -Force
          dotnet run --project source/AetherOnePC/PolicyTests/PolicyTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Policy tests failed' }
          dotnet publish source/AetherOnePC/AetherOnePC/AetherOnePC.csproj -c Release -r win-x64 --self-contained true -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Test WebView2 and actual store downloads
        shell: pwsh
        run: |
          $env:AETHER_SMOKE_OUTPUT = "$env:GITHUB_WORKSPACE\smoke-results"
          $process = Start-Process "$env:GITHUB_WORKSPACE\publish\AetherOne.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(300000)) { $process.Kill(); throw 'Smoke test timed out' }
          Get-Content "$env:AETHER_SMOKE_OUTPUT\smoke-test.txt"
          Get-Content "$env:AETHER_SMOKE_OUTPUT\store-test.txt"
          if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }
      - name: Package portable application
        shell: pwsh
        run: |
          Copy-Item source/AetherOnePC/README.md publish/README.txt
          Compress-Archive -Path publish/* -DestinationPath AetherOne-PC-0.6.1-Windows-x64.zip
          Get-FileHash AetherOne-PC-0.6.1-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AetherOne-PC-0.6.1-Windows-x64
          path: AetherOne-PC-0.6.1-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AetherOne-PC-0.6.1-validation
          path: smoke-results/*.txt
