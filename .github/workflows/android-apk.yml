name: Build Aether One APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android source project
        run: unzip -q AetherOne-Mobile-Android-Source-v0.2.0.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$sdk_manager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK and run Android lint
        working-directory: AetherOneMobile
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s AetherOneMobile/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AetherOne-v0.2.0-debug-apk
          path: AetherOneMobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
