name: Aether native extension installation
on:
  push:
    branches: [aether-standalone-store-check]
    paths: [.github/workflows/aether-store-check.yml]
permissions:
  contents: read
jobs:
  store:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native Web Store install and persistence
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('store-check.py', [Convert]::FromBase64String(''))
          python -m pip install playwright pywinauto
          if ($LASTEXITCODE -ne 0) { throw 'Automation dependency installation failed' }
          Invoke-WebRequest 'https://github.com/brave/brave-browser/releases/download/v1.99.55/brave-v1.99.55-win32-x64.zip' -OutFile engine.zip
          if ((Get-FileHash engine.zip).Hash -ne 'ababc163488bfd58cab7ebe4a4057dd23227c81f5958f3a8597526a278fbae15') { throw 'Engine archive digest mismatch' }
          Expand-Archive engine.zip engine
          python store-check.py engine/brave.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-store-check
          path: store-check.json
